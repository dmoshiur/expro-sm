# Render blueprint for Investor Installment Portal (expro-sm)
# Repository root is the service root (leave Render “Root Directory” blank).
# Node >=22.9 is required (see package.json engines). Render will use the
# latest Node 22.x when this file is present; you can also set NODE_VERSION.

services:
  - type: web
    name: expro-sm
    env: node
    plan: free
    # Build writes client/dist (Vite + Tailwind/PostCSS) and verifies it.
    # `--include=dev` keeps build-time devDependencies (vite, tailwindcss,
    # postcss, autoprefixer) even when NODE_ENV=production, and `prebuild`
    # (`scripts/ensure-deps.mjs`) also self-heals cached `node_modules` when
    # a Render service uses `npm run build` directly as its Build Command.
    buildCommand: npm ci --include=dev && npm run build
    # Migrations are additive and idempotent, so run them on every boot: this
    # guarantees new schema (e.g. 002_investor_portal_login.sql) is applied
    # before the server starts accepting traffic. If your Render plan exposes
    # Pre-Deploy you can move `npm run migrate` there and start with `npm start`.
    # The server process itself then syncs the seed Super Admin from
    # SEED_SUPER_ADMIN_* (see below), so no separate seed step is needed here.
    startCommand: npm run migrate && npm start
    healthCheckPath: /api/health
    autoDeploy: false

    # Node version – Render reads `engines.node` (>=22.9) but setting it here
    # makes the requirement explicit for reviewers.
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.9.0"
      - key: BIND_HOST
        value: 0.0.0.0
      - key: PUBLIC_BASE_URL
        value: https://expro-sm.onrender.com
      - key: TRUST_PROXY
        value: 1
      - key: LOG_LEVEL
        value: info

      # --- Required secrets (set in Render dashboard → Environment, do NOT
      #     commit values here). They are marked `sync: false` so this file
      #     never overwrites dashboard values on deploy.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false

      # --- Super Admin bootstrap. While BOTH are set, every startup creates
      #     the account when missing and re-hashes its password whenever it
      #     no longer matches SEED_SUPER_ADMIN_PASSWORD. Password: at least 12
      #     chars with upper + lower + digit + symbol, not containing the
      #     email name. After the first successful login, change the password
      #     in the app and DELETE both variables (or set
      #     SEED_SUPER_ADMIN_ON_START=false) so restarts cannot reset it.
      #     `sync: false` keeps dashboard values from being overwritten.
      - key: SEED_SUPER_ADMIN_EMAIL
        sync: false
      - key: SEED_SUPER_ADMIN_PASSWORD
        sync: false
      - key: SEED_SUPER_ADMIN_ON_START
        value: "true"
        sync: false

      # --- Optional but recommended (dashboard may leave them at defaults).
      # Payment: keep mock in production only if you intentionally run offline.
      # Real bKash requires PAYMENT_PROVIDER=bkash and all BKASH_* vars.
      - key: PAYMENT_PROVIDER
        value: mock
        sync: false
      - key: SMS_PROVIDER
        value: console
        sync: false
      - key: SMS_DRY_RUN
        value: true
        sync: false
      # Feature flags you may tune later without redeploying the blueprint:
      - key: DB_MIGRATE_ON_START
        value: false
        sync: false
      - key: JOBS_ENABLED
        value: true
        sync: false

    # Disk is not required (Turso is remote). Keep the service stateless.
    # If you need a one-off shell for diagnostics:
    #   Render → Shell → `npm run db:check`  (reports migrations, FKs, invariants)
    #   Render → Shell → `npm run reset-admin`  (force-reset the Super Admin
    #     password from SEED_SUPER_ADMIN_* when locked out: "Invalid email or
    #     password" after changing the env vars usually just needs a redeploy -
    #     the startup sync does the same thing on boot.)
